name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "24.11.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # HTML 주석 조기 종료 검사.
  # 주석 본문에 닫는 시퀀스가 들어가면 거기서 주석이 끊겨 나머지가 화면에 노출된다.
  # 2026-07-28 실제로 배포까지 나가 회원 제보로 알았다(bug/13122). 사람 눈에 잘 안 걸리는
  # 종류라 기계가 막는다. 의존성 설치가 필요 없어 수십 초면 끝난다.
  html-comments:
    name: HTML Comment Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check HTML comments
        run: node scripts/check-html-comments.mjs

      # 관리자 API 인증 가드 — 2026-07-29 에 /api/admin 하위 4개 라우트가
      # 인증 없이 열려 있었다(settings·heap-snapshot·migration 2종).
      # svelte compiler 가 필요 없어 pnpm install 없이 돈다.
      - name: Check admin API auth guard
        run: node scripts/check-admin-api-guard.mjs

      # getClientAddress() 직접 호출 가드 — 2026-08-19.
      # ADDRESS_HEADER=x-real-ip 환경에서 그 헤더가 없으면 이 함수는 throw 한다.
      # SSR 이 event.fetch 로 자기 API 를 부르는 경로에는 x-real-ip 가 없어서,
      # 댓글 API 가 시간당 약 3.6만 건의 500 을 냈고 댓글이 통째로 안 실렸다.
      # ⛔ hooks.server.ts 에 이미 같은 함정을 막는 헬퍼와 주석이 있었는데도 재발했다.
      #    파일 안에만 있고 강제 장치가 없어서다. 주석으로는 못 막아 기계가 막는다.
      - name: Check direct getClientAddress() calls
        run: node scripts/check-client-address.mjs

      # authStore 로 렌더를 가르면 하이드레이션이 폐기된다 — 2026-08-25.
      # authStore 는 모듈 레벨 $state 라 서버에서 채우면 요청 간 공유되어 정보가 샌다.
      # 그래서 $effect 안에서만 채우고, $effect 는 서버에서 실행되지 않는다.
      # → SSR 은 "비로그인", 클라이언트는 "로그인" 으로 그려 DOM 이 어긋난다.
      # 실측: 로그인 x 글상세 14.42% vs 목록 0.11%(같은 분기가 없는 곳).
      # 불일치 하나만 있어도 전체가 폐기되므로 "새로 늘어나는 것" 을 막는 게 핵심이다.
      - name: Check authStore SSR mismatch
        run: node scripts/check-auth-ssr-mismatch.mjs

  # 하이드레이션 AST 가드 — 두 검사가 pnpm install 을 공유한다.
  #
  #  1) 중첩 <a>  (2026-07-28)
  #     게시판 목록 행 <a> 안에 댓글수 <a> 가 있어 시간당 회원 약 1,700명이
  #     하이드레이션 실패를 겪고 있었다(#1040 도입, 관측 부재로 못 보고 있었음).
  #
  #  2) 맞붙은 분기 블록  (2026-07-29)
  #     푸터에 {/if}{#if …} 로 맞붙은 분기가 5쌍 있었다. SSR 마커가 맞닿아
  #     번역이 텍스트 노드를 감싸는 순간 뒤따르는 분기가 연쇄로 밀렸다.
  #     푸터는 모든 페이지에 있어 12시간당 약 2,000명이 영향을 받았다.
  #
  # 둘 다 svelte/compiler AST 로 검사하므로 pnpm install 이 필요하다.
  # ⚠️ 표시 이름(name)은 브랜치 보호의 필수 체크명이라 바꾸지 않았다.
  #    이름을 넓히려면 저장소 설정의 required check 도 함께 바꿔야 한다.
  nested-anchors:
    name: Nested Anchor Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile --prefer-offline

      - name: Check nested anchors
        run: node scripts/check-nested-anchors.mjs

      - name: Check adjacent hydration blocks
        run: node scripts/check-adjacent-blocks.mjs

      - name: Check history state destruction
        run: node scripts/check-history-state.mjs

      # 끊긴 옵셔널 체이닝(`a?.b.c`) 신규 유입 차단.
      # 기존분은 scripts/optional-chain-baseline.json 에 동결돼 있다 — 늘리지 말 것.
      - name: Check optional chain propagation
        run: node scripts/check-optional-chain-propagation.mjs

  # 전체 lint는 수동 실행만 허용한다.
  # PR에서는 eslint-review/prettier-suggester가 이미 같은 역할을 맡고,
  # main push에서는 빌드/테스트/배포 경로를 막지 않도록 분리한다.
  lint:
    name: Lint (${{ matrix.app }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run lint
        working-directory: apps/${{ matrix.app }}
        run: |
            if ! pnpm run lint; then
                echo "❌ Formatting issues found. Showing diff:"
                pnpm exec prettier --write .
                git --no-pager diff --color
                git restore .
                exit 1
            fi

  # 빌드 및 타입 체크
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build workspace packages
        run: |
          pnpm --filter @angple/types build
          pnpm --filter @angple/hook-system build
          pnpm --filter @angple/theme-engine build
          pnpm --filter @angple/i18n build

      - name: Run type check
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: pnpm run build

  # 보안 취약점 스캔은 수동 실행만 허용한다.
  # PR/main 기본 경로에서는 security.yml이 담당하므로 중복 실행을 피한다.
  security:
    name: Security Audit (${{ matrix.app }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run security audit
        working-directory: apps/${{ matrix.app }}
        run: pnpm audit --audit-level=high

  # 테스트 (unit + e2e)
  test:
    name: Test (${{ matrix.app }})
    runs-on: ubuntu-latest
    # ⛔ 여기만 30분이다. DB·Redis·백엔드를 띄우고 브라우저를 깔고 앱을 빌드한 뒤
    #    e2e 까지 돈다. 다른 잡 기준(15분)을 그대로 쓰면 **정상 실행을 죽인다**
    #    (2026-08-19 실측: 25~35분). 캐시가 들으면 크게 줄겠지만, 상한은 여유 있게 둔다.
    timeout-minutes: 30
    strategy:
      matrix:
        app: [web]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: angple_root_2024
          MYSQL_DATABASE: angple_db
          MYSQL_USER: angple_user
          MYSQL_PASSWORD: angple_pass_2024
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uangple_user -pangple_pass_2024"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm fetch --frozen-lockfile
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build workspace packages
        run: |
          pnpm --filter @angple/types build
          pnpm --filter @angple/hook-system build
          pnpm --filter @angple/theme-engine build
          pnpm --filter @angple/i18n build

      # Go 백엔드 설정 (web e2e 테스트용)
      - name: Checkout backend
        if: matrix.app == 'web'
        uses: actions/checkout@v6
        with:
          repository: damoang/angple-backend
          path: angple-backend

      - name: Setup Go
        if: matrix.app == 'web'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: angple-backend/go.sum

      - name: Initialize database
        if: matrix.app == 'web'
        run: |
          for f in angple-backend/.docker/mysql/init/*.sql; do
            echo "Importing $f..."
            mysql -h 127.0.0.1 -u root -pangple_root_2024 angple_db < "$f" || true
          done

      - name: Build and start backend
        id: backend
        if: matrix.app == 'web'
        continue-on-error: true
        working-directory: angple-backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: angple_user
          DB_PASSWORD: angple_pass_2024
          DB_NAME: angple_db
          JWT_SECRET: ci-test-jwt-secret-key-2024
          LEGACY_JWT_SECRET: ci-test-legacy-jwt-secret-2024
          API_PORT: "8081"
          APP_ENV: dev
        run: |
          go build -o /tmp/angple-api cmd/api/main.go
          /tmp/angple-api &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              echo "BACKEND_READY=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start, skipping e2e tests"
          echo "BACKEND_READY=false" >> $GITHUB_OUTPUT

      # ⛔ 예전에는 `playwright install --with-deps` 로 **세 브라우저 전부**(chromium·
      #    firefox·webkit)를 매번 새로 받았다. 그런데 apps/web/playwright.config.ts 에는
      #    projects 가 없어 **chromium 하나만 쓴다** — 2/3 가 순수 낭비였다.
      #    게다가 캐시가 없어 매 실행 20~35분이 걸렸고(2026-08-19 실측, 하루 4번 겪음),
      #    그 시간이 모든 변경의 리드타임에 그대로 얹혔다. 긴급 수정일수록 손해가 컸다.
      - name: Resolve Playwright version
        if: ${{ matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false' }}
        id: pw
        working-directory: apps/${{ matrix.app }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # 캐시 키에 버전을 넣는다 — 버전이 오르면 자동으로 새로 받는다(수동 무효화 불필요).
      - name: Cache Playwright browsers
        if: ${{ matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false' }}
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: ${{ (matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false') && steps.pw-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec playwright install --with-deps chromium

      # ⛔ 캐시가 맞아도 시스템 의존 패키지(apt)는 캐시되지 않는다. 브라우저 바이너리만
      #    복원되고 라이브러리가 없으면 실행 시점에 알 수 없는 에러로 죽는다 — deps 는 따로 깐다.
      - name: Install Playwright system deps (cache hit)
        if: ${{ (matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false') && steps.pw-cache.outputs.cache-hit == 'true' }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec playwright install-deps chromium

      - name: Build app for E2E tests
        if: ${{ matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false' }}
        working-directory: apps/${{ matrix.app }}
        run: pnpm run build

      - name: Create data directory for E2E tests
        if: ${{ matrix.app != 'web' || steps.backend.outputs.BACKEND_READY != 'false' }}
        working-directory: apps/${{ matrix.app }}
        run: mkdir -p data

      - name: Run unit tests with coverage
        working-directory: apps/${{ matrix.app }}
        run: pnpm run test:unit -- --run --coverage

      - name: Run E2E tests
        working-directory: apps/${{ matrix.app }}
        env:
          BACKEND_READY: ${{ steps.backend.outputs.BACKEND_READY || 'true' }}
        run: |
          if [ "${{ matrix.app }}" = "web" ] && [ "$BACKEND_READY" = "false" ]; then
            echo "⚠️ Backend not available, skipping e2e tests"
          else
            pnpm run test:ci:e2e
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          directory: apps/${{ matrix.app }}/coverage
          flags: ${{ matrix.app }}
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  # Prettier 포맷팅 제안 (PR only)
  prettier-suggester:
    name: Prettier Suggestions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        id: prettier-check
        run: |
          pnpm exec prettier --check apps/web > prettier.log 2>&1 || echo "formatting_issues=true" >> $GITHUB_OUTPUT

      - name: Apply formatting and show diff
        if: steps.prettier-check.outputs.formatting_issues == 'true'
        run: |
          echo "❌ Formatting issues found. Showing diff:"
          pnpm exec prettier --write apps/web
          git --no-pager diff --color
          git restore .

      - name: Suggest changes with reviewdog (optional)
        if: always()
        continue-on-error: true
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: prettier
          fail_on_error: false

      - name: Fail if formatting issues
        if: steps.prettier-check.outputs.formatting_issues == 'true'
        run: |
          echo "❌ Please run 'pnpm format' locally to fix formatting issues."
          exit 1

  # ESLint 리뷰 (PR only)
  eslint-review:
    name: ESLint Review (${{ matrix.app }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @angple/types build
          pnpm --filter @angple/hook-system build
          pnpm --filter @angple/theme-engine build
          pnpm --filter @angple/i18n build

      - name: Run ESLint
        id: eslint-check
        working-directory: apps/${{ matrix.app }}
        run: |
          pnpm exec eslint . --format unix > eslint.log 2>&1 || true

      - name: Setup reviewdog
        if: always()
        uses: reviewdog/action-setup@v1

      - name: Report with reviewdog (optional)
        if: always()
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat eslint.log | reviewdog -f=eslint -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

      - name: Check ESLint result
        if: always()
        working-directory: apps/${{ matrix.app }}
        run: |
          if grep -q ":[0-9]*:[0-9]*:" eslint.log; then
            echo "❌ ESLint errors found:"
            cat eslint.log
            exit 1
          else
            echo "✅ No ESLint errors"
          fi

  # TypeScript/Svelte 타입 체크 리뷰 (PR only)
  typecheck-review:
    name: TypeScript Review (${{ matrix.app }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [web]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @angple/types build
          pnpm --filter @angple/hook-system build
          pnpm --filter @angple/theme-engine build
          pnpm --filter @angple/i18n build

      - name: Run svelte-check
        id: svelte-check
        working-directory: apps/${{ matrix.app }}
        run: |
          pnpm exec svelte-check --tsconfig ./tsconfig.json --output machine > typecheck.log 2>&1 || true

      - name: Setup reviewdog
        if: always()
        uses: reviewdog/action-setup@v1

      - name: Report with reviewdog (optional)
        if: always()
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat typecheck.log | reviewdog -f=tsc -reporter=github-pr-review -filter-mode=nofilter -fail-on-error=false

      - name: Check svelte-check result
        if: always()
        working-directory: apps/${{ matrix.app }}
        run: |
          if grep -q "Error:" typecheck.log; then
            echo "❌ Type errors found:"
            cat typecheck.log
            exit 1
          else
            echo "✅ No type errors"
          fi

  # CI 결과 텔레그램 알림
  notify:
    name: Notify Telegram
    needs: [build, security, test]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.security.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        if: steps.status.outputs.result == 'failure'
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_DEPLOY_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=${{ steps.status.outputs.emoji }} *Web CI ${{ steps.status.outputs.result }}*%0A%0ABuild: ${{ needs.build.result }}%0ASecurity: ${{ needs.security.result }}%0ATest: ${{ needs.test.result }}%0A%0A[Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
