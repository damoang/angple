name: Safari Synthetic

on:
  workflow_dispatch:
    inputs:
      run_hydration_diagnostic:
        description: 'iOS Safari 하이드레이션·스크롤복원 진단도 함께 실행'
        type: boolean
        default: false
      hydration_iterations:
        description: '경로당 반복 횟수 (기본 4)'
        type: string
        default: '4'
  schedule:
    - cron: '*/15 * * * *'

env:
  NODE_VERSION: '22'

jobs:
  mobile-safari-synthetic:
    name: Mobile Safari Synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⛔ 이 워크플로는 **15분마다** 돈다(하루 96회). 캐시 없이 webkit 을 매번 받으면
      #    그 다운로드만 하루 수 시간의 러너 시간을 태운다(실측: 회당 2~7분).
      #    캐시 키에 버전을 넣어 버전이 오르면 자동으로 새로 받게 한다.
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps webkit

      # ⛔ 브라우저 바이너리는 캐시돼도 apt 의존 패키지는 캐시되지 않는다.
      #    빼먹으면 캐시 적중일 때만 알 수 없는 실행 오류로 죽는다 — 가장 찾기 어려운 종류다.
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps webkit

      - name: Run Mobile Safari synthetic monitor
        working-directory: apps/web
        env:
          E2E_EXTERNAL_BASE_URL: https://damoang.net
          E2E_SYNTHETIC_POST_PATH: /free/5998999
        # ⛔ @hydration 은 여기서 돌리지 않는다.
        #    현재 iOS Safari 실패율이 ~68% 라 15분마다 실패 → 하루 96번 텔레그램이 울리고
        #    곧 아무도 안 본다(경보 피로). 원인을 고쳐 0 이 된 뒤 이 제외를 풀고
        #    E2E_HYDRATION_MAX_FAIL_RATE=0 으로 회귀 가드로 승격한다.
        run: pnpm exec playwright test --config=playwright.synthetic.config.ts --grep-invert '@hydration|@scroll'

      - name: Upload synthetic report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-safari-synthetic
          path: apps/web/playwright-report-synthetic/
          retention-days: 7

  # iOS Safari 하이드레이션 무결성 진단 — 수동 실행 전용.
  #
  # 원격 계측(error_logs.js_errors)은 "iOS 에서 ~68% 깨진다"까지 알려줬지만
  # **왜** 는 못 알려준다. 여기서 WebKit 으로 재현해 trace/video 를 남긴다.
  #
  # ⛔ notify 잡이 이 잡을 needs 하지 않는다 — 진단이 빨개도 텔레그램은 울리지 않는다.
  #    운영 알림 채널을 진단용으로 오염시키지 않기 위한 의도적 분리다.
  hydration-diagnostic:
    name: Hydration Integrity (iOS Safari)
    if: github.event_name == 'workflow_dispatch' && inputs.run_hydration_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps webkit

      - name: Measure hydration integrity
        working-directory: apps/web
        env:
          E2E_EXTERNAL_BASE_URL: https://damoang.net
          E2E_SYNTHETIC_POST_PATH: /free/5998999
          E2E_HYDRATION_ITERATIONS: ${{ inputs.hydration_iterations }}
          # 진단 단계에서는 수치만 본다. 고친 뒤 0 으로 낮춰 가드로 쓴다.
          E2E_HYDRATION_MAX_FAIL_RATE: '1'
        run: pnpm exec playwright test --config=playwright.synthetic.config.ts --grep '@hydration|@scroll'

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hydration-integrity-report
          path: |
            apps/web/playwright-report-synthetic/
            apps/web/test-results/
          retention-days: 14

  notify:
    name: Notify Telegram
    needs: mobile-safari-synthetic
    if: always() && needs.mobile-safari-synthetic.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_DEPLOY_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=🚨 *Safari Synthetic failure*%0A%0AWorkflow: ${{ github.workflow }}%0ABranch: ${{ github.ref_name }}%0AEvent: ${{ github.event_name }}%0A%0A[Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
