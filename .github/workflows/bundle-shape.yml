name: Bundle Shape

# 빌드 산출물의 「라우트당 JS 파일 수」를 재서 기록한다. 배포하지 않는다.
#
# ⛔ 왜 이 워크플로가 먼저 있어야 하나
#   코드 분할을 세 번 시도해 세 번 운영 사고를 냈다(2026-06 · #2303 · 2026-09-30).
#   3차의 원인은 라우트당 의존 파일이 중위 33개·최대 214개였던 것인데, 그 수치를
#   **카나리에 올린 뒤에야** 알았다. 운영 서버에서는 빌드를 할 수 없어서
#   「배포해서 본다」가 유일한 측정 수단이었고, 그게 세 번에 공통된 구조적 원인이다.
#   → 4차는 배포 전에 CI 에서 숫자를 먼저 본다.
#
# ⛔⛔ **운영과 같은 조건으로 빌드해야 한다.** 처음 판은 `ci.yml` 의 build 잡을 따라
#   core 만 빌드했는데, 운영 라이브와 크기가 달랐다(JS 5,712,207B vs 6,066,325B = +6.2%).
#   원인은 **premium 오버레이**다 — 라이브는 `damoang/angple-premium` 을 얹은 결과물이다.
#   엉뚱한 것을 재면 3차와 같은 실패가 된다. 그래서 `deploy.yml` 의 build 잡을 그대로 따른다:
#     premium 체크아웃 → 충돌 검사 → install.sh → packages 빌드 → VITE_* 주입 → web 빌드
#   러너도 `ubuntu-24.04-arm` 으로 맞춘다(운영과 같은 아키텍처).
#
# ⭐ 임계(`max_files`/`median_files`)는 기본으로 주지 않는다. 기준선 없이 임계를 박으면
#    그 숫자에 근거가 없다.

on:
    pull_request:
        paths:
            - 'apps/web/svelte.config.js'
            - 'apps/web/vite.config.ts'
            - 'apps/web/scripts/bundle-shape*.mjs'
            - '.github/workflows/bundle-shape.yml'
    workflow_dispatch:
        inputs:
            with_premium:
                description: 'premium 오버레이 포함 (운영과 동일). 끄면 core 기여분만 본다'
                type: boolean
                default: true
            max_files:
                description: '라우트당 최대 파일 수 임계 (비우면 판정 없이 측정만)'
                type: string
                default: ''
            median_files:
                description: '라우트당 중위 파일 수 임계 (비우면 판정 없음)'
                type: string
                default: ''

concurrency:
    group: bundle-shape-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: '24.11.1'
    # deploy.yml 과 같은 값. 번들에 들어가는 자산 주소를 바꾸므로 맞춰야 한다.
    MEDIA_CDN_BASE: https://cdn.damoang.net
    STATIC_ASSET_BASE_ROOT: https://static.damoang.net/releases

jobs:
    shape:
        # ⛔ 운영 빌드와 같은 아키텍처. 러너가 다르면 그것도 변수가 된다.
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 40
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # ⭐ 분석기 시험을 빌드보다 먼저. 분석기가 깨졌는데 40분 빌드를 하는 건 낭비다.
            - name: Verify shape analyzer
              run: node apps/web/scripts/bundle-shape.test.mjs

            # ── 아래 4스텝은 deploy.yml build 잡과 동일한 순서다. 발명하지 마라 ──
            - name: Checkout premium
              id: premium
              if: ${{ github.event_name == 'pull_request' || inputs.with_premium }}
              uses: actions/checkout@v4
              with:
                  repository: damoang/angple-premium
                  token: ${{ secrets.PREMIUM_REPO_TOKEN }}
                  path: _premium

            - name: Check premium plugin conflicts
              if: ${{ steps.premium.outcome == 'success' }}
              run: |
                  chmod +x scripts/check-premium-plugin-conflicts.sh
                  scripts/check-premium-plugin-conflicts.sh . _premium

            - name: Install premium assets
              if: ${{ steps.premium.outcome == 'success' }}
              run: |
                  chmod +x _premium/deploy/install.sh
                  _premium/deploy/install.sh .

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: |
                  pnpm fetch --frozen-lockfile
                  pnpm install --frozen-lockfile --prefer-offline

            - name: Build
              env:
                  VITE_USE_MOCK: 'false'
                  VITE_GAM_NETWORK_CODE: '23338387889'
                  VITE_GAM_SITE_NAME: 'damoang'
                  VITE_S3_URL: ${{ env.MEDIA_CDN_BASE }}
                  # ⛔ 운영은 여기에 릴리스 태그가 붙는다. 형상(파일 수)에는 영향이 없고
                  #    자산 주소 문자열만 달라지므로 고정값을 쓴다.
                  ASSET_BASE_URL: ${{ env.STATIC_ASSET_BASE_ROOT }}/bundle-shape
              run: |
                  pnpm --filter "./packages/*" build
                  echo "VITE_GAM_NETWORK_CODE=23338387889" > apps/web/.env
                  echo "VITE_GAM_SITE_NAME=damoang" >> apps/web/.env
                  echo "VITE_S3_URL=${VITE_S3_URL}" >> apps/web/.env
                  pnpm --filter web build

            - name: Premium 포함 여부 기록
              run: |
                  if [ "${{ steps.premium.outcome }}" = "success" ]; then
                    echo "premium=포함 (운영과 동일 조건)"
                  else
                    echo "premium=제외 (core 전용 — 운영 라이브와 다르다)"
                  fi

            - name: Report bundle shape
              working-directory: apps/web
              env:
                  MAX_FILES: ${{ inputs.max_files }}
                  MEDIAN_FILES: ${{ inputs.median_files }}
              run: |
                  ARGS=""
                  [ -n "$MAX_FILES" ] && ARGS="$ARGS --max $MAX_FILES"
                  [ -n "$MEDIAN_FILES" ] && ARGS="$ARGS --median $MEDIAN_FILES"
                  echo "인자: ${ARGS:-(임계 없음 — 측정만)}"
                  node scripts/bundle-shape-report.mjs \
                    .svelte-kit/output/client/_app/immutable $ARGS

            - name: Transfer size
              working-directory: apps/web
              # ⭐ 분할의 목적은 다운로드 축소가 아니다 — 운영 실측으로 brotli 전송은 이미
              #    JS 1,246,824B · CSS 47,853B 다. 목적은 **파싱 6,066,325B** 를 줄이는 것이다.
              #    그래서 전송량이 늘지 않았는지를 함께 본다.
              # ⛔ `brotli` CLI 가 러너에 있다고 가정하지 않고 node 내장 zlib 을 쓴다.
              run: |
                  node -e '
                    const {readdirSync,statSync,readFileSync}=require("node:fs");
                    const {join,extname}=require("node:path");
                    const {brotliCompressSync,constants}=require("node:zlib");
                    const root=".svelte-kit/output/client/_app/immutable";
                    const walk=(d,o=[])=>{for(const n of readdirSync(d)){const p=join(d,n);
                      statSync(p).isDirectory()?walk(p,o):o.push(p);}return o;};
                    const agg={};
                    for(const f of walk(root)){
                      const e=extname(f); if(e!==".js"&&e!==".css") continue;
                      const b=readFileSync(f);
                      const br=brotliCompressSync(b,{params:{[constants.BROTLI_PARAM_QUALITY]:5}});
                      agg[e]=agg[e]||{raw:0,br:0,n:0};
                      agg[e].raw+=b.length; agg[e].br+=br.length; agg[e].n++;
                    }
                    const lines=[];
                    for(const e of [".js",".css"]){
                      const a=agg[e]||{raw:0,br:0,n:0};
                      lines.push(`${e.slice(1).toUpperCase().padEnd(4)} ${String(a.n).padStart(4)}개 · 원본 ${a.raw.toLocaleString()}B · brotli(q5) ${a.br.toLocaleString()}B`);
                    }
                    const out=lines.join("\n");
                    console.log(out);
                    const s=process.env.GITHUB_STEP_SUMMARY;
                    if(s) require("node:fs").appendFileSync(s,
                      "### 전송량\n\n```\n"+out+"\n⛔ q5 는 CI 비교용이다. 운영 엣지 압축률과 같지 않다.\n```\n");
                  '
