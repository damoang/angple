name: Staging Disk Diagnose

# 스테이징 서버 디스크 사용 현황 조회(읽기 전용). 아무것도 지우지 않는다.
on:
  pull_request:
    paths:
      - '.github/workflows/staging-disk-diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect staging disk usage
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 12m
          script: |
            echo "=== df ==="
            df -h / || true
            df -i / | tail -1 || true
            echo "=== whoami / sudo ==="
            id -un; sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
            echo "=== top-level (depth 1) ==="
            timeout 300 du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -15
            echo "=== /home, /var, /opt (depth 2) ==="
            timeout 300 du -xh --max-depth=2 /home /var /opt /tmp 2>/dev/null | sort -rh | head -30
            echo "=== whole disk as root (read-only mount, excl. docker) ==="
            timeout 600 docker run --rm -v /:/h:ro alpine:3.20 sh -c \
              'du -xh -d1 /h 2>/dev/null | sort -rh | head -12; echo "--- depth 3 ---"; du -xh -d3 --exclude=/h/var/lib/docker /h 2>/dev/null | sort -rh | head -40; echo "--- files >2G ---"; find /h -xdev -type f -size +2G -exec du -h {} + 2>/dev/null | sort -rh | head -20' || true
            echo "=== largest files >1G ==="
            timeout 300 find / -xdev -type f -size +1G -printf '%s %p\n' 2>/dev/null | sort -rn | head -20 | awk '{printf "%.1fG %s\n", $1/1073741824, $2}'
            echo "=== docker ==="
            docker system df 2>/dev/null || sudo -n docker system df 2>/dev/null || true
            echo "=== journal ==="
            journalctl --disk-usage 2>/dev/null || sudo -n journalctl --disk-usage 2>/dev/null || true
            echo "=== deleted-but-open files (top 10 by size) ==="
            sudo -n lsof -nP +L1 2>/dev/null | awk 'NR>1{print $7, $1, $NF}' | sort -rn | head -10 || true
